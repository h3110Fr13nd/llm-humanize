[project]
name = "llm-alignerr"
version = "0.1.0"
description = "Adaptive Decoding & Non-Autoregressive Paradigms for Text Humanization"
readme = "README.md"
authors = [
    { name = "h3110Fr13nd", email = "dummy_mail" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[project.scripts]
llm = "llm:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
